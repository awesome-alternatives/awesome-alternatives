[package]
name = "awesome-alternatives-api"
version = "0.6.1"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
ammonia = "4.2.0"
axum = "0.8"
fastembed = { version = "7", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
governor = "0.10"
moka = { version = "0.12", features = ["future"] }
redis = { version = "1.7", default-features = false, features = ["connection-manager", "tokio-rustls-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "fs"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
