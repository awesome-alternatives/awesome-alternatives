[package]
name = "awesome-alternatives-api"
version = "0.17.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
ammonia = "4.2.0"
axum = "0.8"
fastembed = { version = "7", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
governor = "0.10"
hex = "0.4.3"
hmac = "0.13.0"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto", "use_pem"] }
moka = { version = "0.12", features = ["future"] }
redis = { version = "1.7", default-features = false, features = ["connection-manager", "tokio-rustls-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
sqlx = { version = "0.9", default-features = false, features = ["derive", "postgres", "runtime-tokio", "time", "tls-rustls-ring-webpki"] }
thiserror = "2"
time = { version = "0.3.55", features = ["serde-human-readable"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs"] }
tower = { version = "0.5", features = ["limit", "load-shed", "timeout", "util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
http-body-util = "0.1"
rand = "0.8"
rsa = "0.9"
time = { version = "0.3.55", features = ["macros"] }
tokio = { version = "1", features = ["io-util"] }
