    container-steps:
      label: "Steps in containers"
      match: ["container steps", "steps in containers", "each step in a container", "étapes en conteneurs", "pasos en contenedores"]
    kubernetes:
      label: "Runs on Kubernetes"
      match: ["on kubernetes", "kubernetes native", "sur kubernetes", "en kubernetes", "auf kubernetes"]

git-forge:
  name: Git forges
  description: Self-hosted repositories, code review and issues.
  selfHost: true
  capabilities:
    ci:
      label: "CI/CD"
      match: ["ci", "ci/cd", "cicd", "continuous integration", "intégration continue", "integración continua", "kontinuierliche integration"]
    container-registry:
      label: "Container registry"
      match: ["container registry", "docker registry", "registre docker", "registre de conteneurs", "registro de contenedores", "registro docker", "container-registry"]
    package-registry:
      label: "Package registry"
      match: ["package registry", "packages registry", "registre de paquets", "registro de paquetes", "paket-registry", "npm registry", "maven registry"]
    wiki:
      label: "Wiki"
      match: ["wiki"]
    pages:
      label: "Static site hosting"
      match: ["static site hosting", "static pages", "gitlab pages", "hébergement de site statique", "pages statiques", "sitios estáticos", "statische seiten"]

