name: DbGate
repository: https://github.com/dbgate/dbgate
category: database-client
replaces:
  - tool: tableplus
    fit: full
    note: Desktop or web client for SQL and NoSQL databases, with a data editor and query designer.
  - tool: datagrip
    fit: partial
    note: SQL editor, schema compare and data export, without the IDE's code analysis.
  - tool: navicat
    fit: partial
    note: Data editor, query editor and schema tools for SQL databases and MongoDB; fewer data transfer and sync tools.
  - tool: studio-3t
    fit: partial
    note: Collection browser, query editor and data editing for MongoDB; no visual aggregation builder.
