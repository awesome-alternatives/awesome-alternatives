name: Firefly III
repository: https://github.com/firefly-iii/firefly-iii
category: personal-finance
replaces:
  - tool: ynab
    fit: partial
    note: Accounts, budgets, rules and reports in a web app, but budgets are spending limits rather than YNAB's zero-based envelopes.
  - tool: mint
    fit: full
    note: Accounts, budgets, rules and reports in a web app, with bank transactions brought in through its separate data importer.
  - tool: monarch-money
    fit: partial
    note: Accounts, budgets, rules and reports in a web app, with bank transactions brought in through its separate data importer; no investment tracking.
  - tool: rocket-money
    fit: partial
    note: Budgets, recurring transactions and reports; no subscription cancellation or bill negotiation.
deploy: [container, compose, helm]
