name: FerretDB
repository: https://github.com/FerretDB/FerretDB
category: document-database
replaces:
  - tool: mongodb
    fit: drop-in
    note: Speaks the MongoDB wire protocol on top of PostgreSQL.
    migration: https://docs.ferretdb.io/migration/
  - tool: mongodb-atlas
    fit: partial
    note: Speaks the MongoDB wire protocol on top of PostgreSQL, run by you, without every MongoDB command or Atlas service.
deploy: [container, compose, binary, package]
