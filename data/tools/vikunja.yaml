name: Vikunja
repository: https://github.com/go-vikunja/vikunja
category: project-management
replaces:
  - tool: trello
    fit: full
    note: Kanban, list, Gantt and table views, with a Trello importer.
  - tool: asana
    fit: partial
    note: Tasks and projects for individuals and small teams.
  - tool: todoist
    fit: full
    note: Tasks with projects, labels, saved filters, reminders and repeating due dates, with a Todoist importer.
    migration: https://vikunja.io/docs/setup-todoist-migration
deploy: [container, binary]
