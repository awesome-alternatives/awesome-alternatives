name: Rocket.Chat
repository: https://github.com/RocketChat/Rocket.Chat
category: team-chat
replaces:
  - tool: mattermost
    fit: full
    note: Channels, threads and federation, self-hosted.
  - tool: slack
    fit: full
    note: Channels, threads and federation on your own server, with an importer for Slack exports.
  - tool: microsoft-teams
    fit: partial
    note: Chat and calls on your own server, without the Microsoft 365 integration.
terms: open-core
