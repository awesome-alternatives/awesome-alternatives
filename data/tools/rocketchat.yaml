name: Rocket.Chat
repository: https://github.com/RocketChat/Rocket.Chat
category: team-chat
replaces:
  - tool: mattermost
    fit: full
    note: Channels, threads and federation, self-hosted.
  - tool: slack
    fit: full
    note: Channels, threads and federation on your own server, with an importer for Slack exports.
  - tool: microsoft-teams
    fit: partial
    note: Chat and calls on your own server, without the Microsoft 365 integration.
terms: open-core
capabilities:
  calls:
    docs: https://docs.rocket.chat/docs/rocketchat-conference-call
  threads:
    docs: https://docs.rocket.chat/docs/threads
  federation:
    docs: https://docs.rocket.chat/docs/decentralized-communication-with-federation-in-rocketchat
  e2e-encryption:
    docs: https://docs.rocket.chat/docs/configure-e2e-encryption
deploy: [container, compose, helm, package]
