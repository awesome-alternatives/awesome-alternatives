name: Plane
repository: https://github.com/makeplane/plane
category: project-management
replaces:
  - tool: jira
    fit: full
    note: Issues, cycles, modules and pages, with a Jira importer.
  - tool: linear
    fit: full
    note: Issues, cycles and triage in a similar layout.
  - tool: clickup
    fit: partial
    note: Work items, cycles and pages, with a ClickUp importer in Plane Cloud and the Commercial Edition.
    migration: https://docs.plane.so/importers/clickup
  - tool: monday-com
    fit: partial
    note: Work items in board, calendar, table and timeline layouts.
deploy: [container, helm]
