name: DataHub
repository: https://github.com/datahub-project/datahub
category: data-catalog
replaces:
  - tool: alation
    fit: partial
    note: Metadata search, lineage, ownership and glossary across warehouses, BI tools and pipelines.
  - tool: atlan
    fit: partial
    note: Metadata search, lineage, ownership and glossary across warehouses, BI tools and pipelines.
  - tool: collibra
    fit: full
    note: Catalog with search, lineage and glossary terms across data sources.
  - tool: monte-carlo
    fit: partial
    note: Lineage and data assertions in the open source edition; automated anomaly monitors are part of the hosted product.
deploy: [container]
