name: Typesense
repository: https://github.com/typesense/typesense
category: search-engine
replaces:
  - tool: elasticsearch
    fit: partial
    note: Typo-tolerant app and site search, not log analytics.
  - tool: algolia
    fit: full
    note: Typo-tolerant instant search you can host yourself.
    migration: https://typesense.org/docs/guide/migrating-from-algolia.html
