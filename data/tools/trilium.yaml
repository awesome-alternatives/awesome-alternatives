name: Trilium Notes
repository: https://github.com/TriliumNext/Trilium
category: note-taking
replaces:
  - tool: evernote
    fit: full
    note: Hierarchical notes with a web clipper and Evernote import, synced through a server you host.
  - tool: onenote
    fit: partial
    note: A hierarchy of rich-text notes synced through a server you host, without OneNote's free-form pages or handwriting.
