name: Apache Cassandra
repository: https://github.com/apache/cassandra
category: wide-column-database
replaces:
  - tool: amazon-keyspaces
    fit: drop-in
    note: Keyspaces implements Cassandra's CQL API, so drivers and queries carry over; IAM authentication becomes Cassandra roles.
  - tool: astra-db
    fit: full
    note: Astra DB is built on Cassandra, so CQL tables and drivers carry over; the Data API and serverless scaling do not.
  - tool: amazon-dynamodb
    fit: partial
    note: Partitioned wide-column tables with tunable consistency through CQL, not the DynamoDB API.
  - tool: bigtable
    fit: partial
    note: Wide-column database with partitioned rows, queried with CQL instead of the HBase client.
deploy: [package]
