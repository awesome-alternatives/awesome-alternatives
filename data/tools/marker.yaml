name: Marker
repository: https://github.com/datalab-to/marker
category: document-parsing
replaces:
  - tool: llamaparse
    fit: full
    note: Converts PDF, DOCX and images to Markdown, JSON or HTML, with optional LLM help.
  - tool: amazon-textract
    fit: partial
    note: Converts PDFs and scans to Markdown with OCR, tables and layout detection; no form key-value API.
