name: Formbricks
repository: https://github.com/formbricks/formbricks
category: forms-surveys
terms: open-core
replaces:
  - tool: typeform
    fit: full
    note: Link surveys, plus in-app and website surveys.
  - tool: google-forms
    fit: full
    note: Forms and surveys with logic, on your own server.
  - tool: surveymonkey
    fit: full
    note: Link surveys with logic and response analysis, plus in-app and website surveys.
  - tool: jotform
    fit: partial
    note: Surveys and feedback forms, not payment or approval forms.
  - tool: hotjar
    fit: partial
    note: On-site and in-app feedback surveys, without heatmaps or session recordings.
deploy: [container]
