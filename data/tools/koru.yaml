name: Koru
repository: https://github.com/koruworks/mono
category: note-taking
replaces:
  - tool: evernote
    fit: partial
    note: Notes and documents in a desktop app for Windows, macOS and Linux, stored on your devices and synced device to device, with an Evernote (.enex) importer. No mobile app or web clipper.
  - tool: notion
    fit: partial
    note: Nested documents with headings, tables, checklists and attachments in a local-first desktop app, with a Notion importer.
  - tool: onenote
    fit: partial
    note: Desktop notebooks of documents on Windows, macOS and Linux, synced peer-to-peer without a Microsoft account, with a OneNote importer.
