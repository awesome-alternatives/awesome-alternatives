name: MeshCentral
repository: https://github.com/Ylianst/MeshCentral
category: remote-desktop
replaces:
  - tool: teamviewer
    fit: partial
    note: Web-based remote desktop, terminal and file access to machines running its agent.
  - tool: anydesk
    fit: partial
    note: Web-based remote desktop, terminal and file access to machines running its agent.
  - tool: ninjaone
