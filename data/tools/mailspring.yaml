name: Mailspring
repository: https://github.com/Foundry376/Mailspring
category: email-client
replaces:
  - tool: microsoft-outlook
    fit: partial
    note: Desktop mail for IMAP, Gmail and Office 365 accounts on Windows, macOS and Linux, without a calendar.
  - tool: superhuman
    fit: partial
    note: Snooze, send later, templates and read receipts in a fast client; some of these need the paid Pro plan, and there is no command-driven triage.
