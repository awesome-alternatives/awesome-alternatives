name: Chili3D
repository: https://github.com/xiangechen/chili3d
category: cad
replaces:
  - tool: onshape
    fit: partial
    note: 3D CAD that runs in the browser on your machine with OpenCascade, without cloud documents or collaboration.
  - tool: fusion-360
    fit: partial
    note: Parametric modelling in the browser or as a desktop app; no CAM or simulation.
  - tool: solidworks
    fit: partial
    note: Browser-based parametric modelling with sketches and boolean operations; no assemblies or drawings.
