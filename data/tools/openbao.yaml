name: OpenBao
repository: https://github.com/openbao/openbao
category: secrets-manager
replaces:
  - tool: vault
    fit: drop-in
    note: Fork of Vault 1.14 under MPL-2.0, same API.
    migration: https://openbao.org/docs/guides/migration/
capabilities:
  dynamic-secrets:
    docs: https://openbao.org/docs/secrets/databases/
  pki:
    docs: https://openbao.org/docs/secrets/pki/
deploy: [container, helm, binary, package]
