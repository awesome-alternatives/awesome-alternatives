name: Infisical
repository: https://github.com/Infisical/infisical
category: secrets-manager
replaces:
  - tool: vault
    fit: partial
    note: Application secrets and environment sync, not a general PKI or encryption service.
  - tool: doppler
    fit: full
    note: Secrets synced to environments and CI, self-hostable.
terms: open-core
capabilities:
  dynamic-secrets:
    docs: https://infisical.com/docs/documentation/platform/dynamic-secrets/overview
  pki:
    docs: https://infisical.com/docs/documentation/platform/pki/overview
  secret-rotation:
    docs: https://infisical.com/docs/documentation/platform/secret-rotation/overview
