name: Colima
repository: https://github.com/abiosoft/colima
category: container-desktop
replaces:
  - tool: docker-desktop
    fit: partial
    note: Runs a container runtime and an optional Kubernetes from the command line, with no GUI.
  - tool: orbstack
    fit: partial
    note: Runs Docker and Kubernetes in a Lima VM on macOS, from the command line.
