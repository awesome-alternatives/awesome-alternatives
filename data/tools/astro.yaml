name: Astro
repository: https://github.com/withastro/astro
category: static-site-generator
terms: open
replaces:
  - tool: gatsby
    fit: full
    note: Ships HTML without JavaScript by default and renders React, Vue or Svelte components only where needed.
    migration: https://docs.astro.build/en/guides/migrate-to-astro/from-gatsby/
  - tool: jekyll
    fit: full
    note: Markdown and MDX content collections, built to static HTML.
    migration: https://docs.astro.build/en/guides/migrate-to-astro/from-jekyll/
  - tool: hexo
    fit: full
    note: Content collections in Markdown and MDX, built to static HTML.
