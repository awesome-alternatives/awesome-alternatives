name: OneDev
repository: https://github.com/theonedev/onedev
category: git-forge
replaces:
  - tool: gitlab
    fit: full
    note: Self-hosted forge with CI/CD and boards built in.
  - tool: github
    fit: full
    note: Pull requests, issues and built-in CI/CD, with pipelines in its own format rather than GitHub Actions.
  - tool: jenkins
    fit: partial
    note: CI/CD built into the forge.
  - tool: bitbucket
    fit: full
    note: Repositories, pull requests and CI/CD on your own server.
capabilities:
  ci:
    docs: https://docs.onedev.io/category/cicd
  container-registry:
    docs: https://docs.onedev.io/tutorials/package/working-with-container-image
  package-registry:
    docs: https://docs.onedev.io/tutorials/package/working-with-packages
  wiki:
    docs: https://docs.onedev.io/tutorials/wiki/working-with-wiki
