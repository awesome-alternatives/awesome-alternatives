name: Ghost
repository: https://github.com/TryGhost/Ghost
category: newsletter
replaces:
  - tool: substack
    fit: full
    note: Publishing with free and paid newsletter subscriptions on your own domain.
    migration: https://ghost.org/docs/migration/substack/
  - tool: mailchimp
    fit: partial
    note: Newsletters to the members of a Ghost site, not general marketing campaigns.
  - tool: squarespace
    fit: partial
    note: A blog or publication with members and newsletters, not a drag-and-drop site builder or an online store.
    migration: https://ghost.org/docs/migration/squarespace/
  - tool: wix
    fit: partial
    note: A blog or publication with members and newsletters, not a drag-and-drop site builder or an online store.
deploy: [compose]
