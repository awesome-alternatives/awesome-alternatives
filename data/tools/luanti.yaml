name: "Luanti"
repository: https://github.com/luanti-org/luanti
category: sandbox-game
replaces:
  - tool: minecraft-java-edition
    fit: partial
    note: "Voxel engine with Lua mods and its own games; ships a Minecraft-like game but does not load Minecraft worlds or mods."
  - tool: roblox
    fit: partial
    note: "Players and modders build and share games on one engine in Lua; there is no hosted publishing platform or avatar economy."
terms: open
