name: Litestar
repository: https://github.com/litestar-org/litestar
category: python-web-framework
replaces:
  - tool: flask
    fit: full
    note: Async and typed, with dependency injection and OpenAPI built in.
  - tool: django-rest-framework
    fit: partial
    note: Builds the same kind of API outside Django, without its ORM and admin.
