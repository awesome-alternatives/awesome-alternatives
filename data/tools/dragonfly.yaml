name: Dragonfly
repository: https://github.com/dragonflydb/dragonfly
category: key-value-store
replaces:
  - tool: redis
    fit: drop-in
    note: Redis and Memcached API compatible, multithreaded.
  - tool: memcached
    fit: full
    note: "Speaks the memcached protocol as well as Redis's."
  - tool: redis-cloud
    fit: full
    note: A multithreaded server compatible with the Redis API, run on your own machines.
terms: source-available
deploy: [container, compose, helm, binary, package]
