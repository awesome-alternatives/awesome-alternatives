name: Koodo Reader
repository: https://github.com/koodo-reader/koodo-reader
category: ebook-reader
replaces:
  - tool: apple-books
    fit: partial
    note: Library and reader for your own EPUB, PDF and comics, synced through storage you choose; there is no store.
  - tool: adobe-digital-editions
    fit: partial
    note: Reads EPUB and PDF with highlights and notes; cannot open books protected with Adobe DRM.
