name: Grafana
repository: https://github.com/grafana/grafana
category: dashboards
replaces:
  - tool: kibana
    fit: partial
    note: Dashboards over many data sources, Elasticsearch among them, rather than one stack.
  - tool: datadog
    fit: partial
    note: Dashboards and alerting over metrics, logs and traces stored in your own backends.
  - tool: splunk
    fit: partial
    note: Dashboards and alerts over logs stored in Loki or other backends.
deploy: [container, helm, binary, package]
