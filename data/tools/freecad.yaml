name: FreeCAD
repository: https://github.com/FreeCAD/FreeCAD
category: cad
replaces:
  - tool: solidworks
    fit: partial
    note: Parametric parts, assemblies and drawings with FEM and CAM workbenches; reads STEP and IGES but not native SolidWorks files.
  - tool: fusion-360
    fit: partial
    note: Parametric modelling with CAM on the desktop, without cloud storage or collaboration.
  - tool: autocad
    fit: partial
    note: Parametric 3D modelling with a 2D drafting workbench; DWG import and export goes through converters.
  - tool: onshape
    fit: partial
    note: Parametric solid modelling with sketches and assemblies on the desktop; no browser access or live collaboration.
