name: Gitea
repository: https://github.com/go-gitea/gitea
category: git-forge
replaces:
  - tool: gitlab
    fit: full
    note: Lightweight single binary, with Actions compatible with GitHub Actions.
  - tool: github
    fit: full
    note: Pull requests, issues and Actions that run GitHub Actions workflows, on your own server.
    migration: https://docs.gitea.com/usage/migration
  - tool: jenkins
    fit: partial
    note: Gitea Actions runs GitHub Actions-style workflows inside the forge.
  - tool: bitbucket
    fit: full
    note: Repositories, pull requests and CI on your own server.
