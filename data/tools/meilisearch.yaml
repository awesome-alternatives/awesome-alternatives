name: Meilisearch
repository: https://github.com/meilisearch/meilisearch
category: search-engine
replaces:
  - tool: elasticsearch
    fit: partial
    note: Search-as-you-type for apps and sites, not log analytics.
  - tool: algolia
    fit: full
    note: Typo-tolerant instant search you can host yourself.
    migration: https://www.meilisearch.com/docs/learn/update_and_migration/algolia_migration
terms: open-core
deploy: [container, helm, binary, package]
