name: Password Pusher
repository: https://github.com/pglombardo/PasswordPusher
category: secret-sharing
replaces:
  - tool: privnote
    fit: full
    note: Shares text through a link that expires by views or days, and can be self-hosted.
  - tool: onetimesecret
    fit: full
    note: Shares secrets through expiring links, with limits on views and days.
