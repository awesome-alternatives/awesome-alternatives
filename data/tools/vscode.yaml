name: Visual Studio Code
repository: https://github.com/microsoft/vscode
category: text-editor
replaces:
  - tool: atom
    fit: full
    note: An Electron editor with extensions and git built in.
  - tool: intellij-idea
    fit: partial
    note: Java editing, debugging and Maven or Gradle support through extensions, with less built-in refactoring and code inspection than the IDE.
