name: Umami
repository: https://github.com/umami-software/umami
category: web-analytics
replaces:
  - tool: matomo
    fit: full
    note: Cookie-free, runs on PostgreSQL or MySQL.
  - tool: google-analytics
    fit: partial
    note: Page views, sources and events without cookies, and no reports on individual visitors.
deploy: [container, compose]
