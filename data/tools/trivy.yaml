name: Trivy
repository: https://github.com/aquasecurity/trivy
category: vulnerability-scanner
replaces:
  - tool: snyk
    fit: partial
    note: Scans dependencies, container images, infrastructure as code and secrets from the CLI or CI; no hosted dashboard or fix pull requests.
  - tool: black-duck
    fit: partial
    note: Scans dependencies and images for vulnerabilities and reports licences; no snippet matching or approval workflow.
  - tool: wiz
    fit: partial
    note: Scans images, repositories, IaC and Kubernetes clusters for vulnerabilities and misconfigurations; no cloud account graph or attack path analysis.
