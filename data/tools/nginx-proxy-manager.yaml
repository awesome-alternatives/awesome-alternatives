name: Nginx Proxy Manager
repository: https://github.com/NginxProxyManager/nginx-proxy-manager
category: reverse-proxy
replaces:
  - tool: traefik
    fit: partial
    note: Web UI for proxy hosts and Let's Encrypt certificates, without Traefik's automatic container discovery.
  - tool: caddy
    fit: partial
    note: Reverse proxy with automatic HTTPS, configured through a web UI instead of a Caddyfile.
deploy: [container, compose]
