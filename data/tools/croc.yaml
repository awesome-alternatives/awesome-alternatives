name: croc
repository: https://github.com/schollz/croc
category: local-file-transfer
replaces:
  - tool: wetransfer
    fit: partial
    note: Sends files from one computer to another through a relay with a code phrase and end-to-end encryption; nothing waits online for later download.
  - tool: airdrop
    fit: partial
    note: Sends files between two machines with a one-time code over any network; no discovery of nearby devices.
