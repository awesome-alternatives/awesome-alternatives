name: Apache Kafka
repository: https://github.com/apache/kafka
category: message-streaming
replaces:
  - tool: confluent-cloud
    fit: full
    note: The same Kafka brokers and clients, run and operated by you.
  - tool: amazon-sqs
    fit: partial
    note: Durable topics with consumer groups and replay, with more to operate than a managed queue.
deploy: [container]
