name: Uptime Kuma
repository: https://github.com/louislam/uptime-kuma
category: uptime-monitoring
replaces:
  - tool: pingdom
    fit: full
    note: Uptime checks, alerts and status pages, self-hosted.
  - tool: statuspage
    fit: full
    note: Public status pages next to the monitors, self-hosted.
  - tool: cronitor
    fit: partial
    note: Push monitors for heartbeats next to uptime checks and status pages, without start and finish telemetry for jobs.
deploy: [container, compose]
