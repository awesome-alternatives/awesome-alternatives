name: Actual Budget
repository: https://github.com/actualbudget/actual
category: personal-finance
replaces:
  - tool: ynab
    fit: full
    note: Envelope budgeting in a local-first app, with an optional sync server and bank sync through providers such as SimpleFIN or Enable Banking.
    migration: https://actualbudget.org/docs/migration/nynab/
  - tool: mint
    fit: partial
    note: Envelope budgeting with bank sync through providers such as SimpleFIN or Enable Banking, without investment tracking.
  - tool: rocket-money
    fit: partial
    note: Budgeting and transaction tracking with bank sync; no subscription cancellation or bill negotiation.
deploy: [container, compose, binary]
