name: NATS
repository: https://github.com/nats-io/nats-server
category: message-streaming
replaces:
  - tool: kafka
    fit: partial
    note: Durable streams with JetStream, without Kafka's protocol.
  - tool: amazon-sqs
    fit: partial
    note: Work queues on JetStream streams, through its own protocol and clients.
deploy: [container, binary]
