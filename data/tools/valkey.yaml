name: Valkey
repository: https://github.com/valkey-io/valkey
category: key-value-store
replaces:
  - tool: redis
    fit: drop-in
    note: Fork of Redis 7.2.4, same protocol and commands.
    migration: https://valkey.io/topics/migration/
  - tool: memcached
    fit: partial
    note: "Serves as a cache in memcached's place, but through the Redis protocol."
deploy: [container]
