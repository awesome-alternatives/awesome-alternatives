name: Activepieces
repository: https://github.com/activepieces/activepieces
category: workflow-automation
terms: open-core
replaces:
  - tool: zapier
    fit: full
    note: Visual flows with a library of integrations written in TypeScript.
  - tool: n8n
    fit: full
    note: Visual flows with its community edition under MIT.
  - tool: ifttt
    fit: full
    note: Trigger-and-action flows with a library of integrations, self-hosted.
deploy: [container, compose]
