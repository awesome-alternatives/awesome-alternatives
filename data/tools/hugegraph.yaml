name: Apache HugeGraph
repository: https://github.com/apache/hugegraph
category: graph-database
replaces:
  - tool: amazon-neptune
    fit: partial
    note: Covers Gremlin and openCypher queries; SPARQL and RDF data are not supported.
  - tool: azure-cosmos-db-gremlin
    fit: full
    note: Property graph database queried with Apache TinkerPop Gremlin.
  - tool: tigergraph
    fit: partial
    note: Distributed graph database queried with Gremlin; no GSQL or built-in analytics library.
deploy: [container, compose]
