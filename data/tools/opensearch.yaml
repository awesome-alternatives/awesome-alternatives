name: OpenSearch
repository: https://github.com/opensearch-project/OpenSearch
category: search-engine
replaces:
  - tool: elasticsearch
    fit: full
    note: Fork of Elasticsearch 7.10.2, APIs have diverged since.
  - tool: splunk
    fit: partial
    note: Log search and analytics with OpenSearch Dashboards.
  - tool: elastic-cloud
    fit: full
    note: Fork of Elasticsearch 7.10.2 with OpenSearch Dashboards, run on your own machines; APIs have diverged since.
deploy: [container, compose, helm, package]
