name: GemRB
repository: https://github.com/gemrb/gemrb
category: role-playing-game
replaces:
  - tool: baldurs-gate
    fit: full
    note: Reimplementation of the Infinity Engine that runs Baldur's Gate from the original game data. Only a trivial demo ships without it.
  - tool: icewind-dale
    fit: full
    note: Runs Icewind Dale from the original game data, with the same requirement as for Baldur's Gate.
