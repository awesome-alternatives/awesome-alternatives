name: Gatus
repository: https://github.com/TwiN/gatus
category: uptime-monitoring
replaces:
  - tool: uptime-kuma
    fit: full
    note: Checks declared in YAML, with alerting and a status page.
  - tool: pingdom
    fit: full
    note: Health checks declared in YAML, with alerts and a status page.
  - tool: statuspage
    fit: full
    note: A status page built from its own health checks.
  - tool: cronitor
    fit: partial
    note: External endpoints take heartbeats pushed from jobs, next to its own checks and a status page.
deploy: [container, compose, helm]
