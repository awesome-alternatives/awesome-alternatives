name: Krayin CRM
repository: https://github.com/krayin/laravel-crm
category: crm
replaces:
  - tool: salesforce
    fit: partial
    note: Leads, contacts, pipelines and quotes, without the marketing and service clouds.
  - tool: hubspot
    fit: partial
    note: Sales CRM only, without the marketing hub.
  - tool: pipedrive
    fit: full
    note: Leads moved through configurable pipeline stages on a kanban board, with activities, emails and quotes.
