name: ConvertX
repository: https://github.com/C4illin/ConvertX
category: media-converter
replaces:
  - tool: cloudconvert
    fit: full
    note: Converts documents, images, audio and video on your own server behind a web interface.
  - tool: adobe-media-encoder
    fit: partial
    note: Batch conversion of video and audio through FFmpeg in a web interface; no link to Premiere Pro or After Effects.
