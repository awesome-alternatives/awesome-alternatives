name: Miniflux
repository: https://github.com/miniflux/v2
category: feed-reader
replaces:
  - tool: feedly
    fit: full
    note: A minimalist feed reader in one binary, with Fever and Google Reader APIs.
  - tool: inoreader
    fit: partial
    note: Feed reader with filter and blocklist rules and full text search; no newsletter subscriptions.
deploy: [container, binary, package]
