name: Concourse
repository: https://github.com/concourse/concourse
category: ci-server
replaces:
  - tool: jenkins
    fit: full
    note: Pipelines declared as resources and jobs, every step in a container.
  - tool: circleci
    fit: full
    note: Self-hosted pipelines, each step in a container.
capabilities:
  container-steps:
    docs: https://concourse-ci.org/docs/tasks/
deploy: [container, compose, helm, binary]
