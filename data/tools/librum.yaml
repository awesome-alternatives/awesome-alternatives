name: Librum
repository: https://github.com/Librum-Reader/Librum
category: ebook-reader
replaces:
  - tool: amazon-kindle
    fit: partial
    note: Library and reader for your own books with cloud sync; there is no store.
  - tool: apple-books
    fit: partial
    note: Desktop reader for EPUB and PDF with a library synced through its server; no book store or audiobooks.
