name: Synapse
repository: https://github.com/element-hq/synapse
category: team-chat
replaces:
  - tool: slack
    fit: partial
    note: A Matrix homeserver; teams chat through a client such as Element, and can federate with other servers.
  - tool: microsoft-teams
    fit: partial
    note: Chat only, through a Matrix client.
  - tool: discord
    fit: partial
    note: A Matrix homeserver; communities are organised as spaces of rooms through a client such as Element, and can federate with other servers.
deploy: [container]
