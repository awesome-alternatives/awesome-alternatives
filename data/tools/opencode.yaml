name: OpenCode
repository: https://github.com/anomalyco/opencode
category: coding-agent
replaces:
  - tool: claude-code
    fit: full
    note: Terminal agent that works with Anthropic, OpenAI and Google models or a local one.
  - tool: github-copilot
    fit: partial
    note: An agent that works on the whole repository, without completions as you type.
  - tool: cursor
    fit: partial
    note: A terminal agent rather than an editor, with any model provider.
