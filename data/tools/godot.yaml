name: Godot
repository: https://github.com/godotengine/godot
category: game-engine
replaces:
  - tool: unity
    fit: full
    note: "2D and 3D engine with its own editor, scripted in GDScript or C#, exporting to desktop, mobile and the web."
  - tool: construct
    fit: partial
    note: 2D and 3D engine with a node editor and GDScript; no event sheets.
  - tool: gamemaker
    fit: partial
    note: 2D and 3D engine with its own GDScript language and an editor.
  - tool: unreal-engine
    fit: partial
    note: Open source engine with 2D and 3D rendering and its own scripting language; less capable for high-fidelity 3D.
