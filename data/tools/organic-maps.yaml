name: Organic Maps
repository: https://github.com/organicmaps/organicmaps
category: maps-navigation
replaces:
  - tool: google-maps
    fit: partial
    note: Offline maps and navigation from OpenStreetMap data without tracking; no live traffic or Street View.
  - tool: alltrails
    fit: partial
    note: Offline OpenStreetMap maps with hiking trails and GPX tracks; no trail reviews or photos.
terms: open
