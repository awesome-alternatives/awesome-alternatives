name: SigNoz
repository: https://github.com/SigNoz/signoz
category: tracing
terms: open-core
replaces:
  - tool: datadog
    fit: full
    note: Metrics, logs and traces in one app, built on OpenTelemetry and ClickHouse.
  - tool: new-relic
    fit: full
    note: APM, logs and dashboards from OpenTelemetry data, on your own servers.
  - tool: honeycomb
    fit: full
    note: Traces, logs and metrics on OpenTelemetry data with a query builder and dashboards.
deploy: [container, compose, helm]
