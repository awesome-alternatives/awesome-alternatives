name: octoDNS
repository: https://github.com/octodns/octodns
category: infrastructure-as-code
replaces:
  - tool: dnscontrol
    fit: full
    note: DNS records as YAML synced to many providers, written in Python.
  - tool: amazon-route-53
    fit: partial
    note: Keeps DNS records in files and syncs them to Route 53 and other providers; no DNS hosting of its own.
