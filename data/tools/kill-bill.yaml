name: Kill Bill
repository: https://github.com/killbill/killbill
category: billing
replaces:
  - tool: stripe-billing
    fit: full
    note: Subscriptions, usage billing and invoicing, with payment gateways added as plugins.
  - tool: chargebee
    fit: full
    note: Subscription catalog, invoicing and dunning on your own server.
  - tool: stripe
    fit: partial
    note: Orchestrates payments through gateway plugins with retries and subscriptions; does not process cards itself.
deploy: [container, compose]
