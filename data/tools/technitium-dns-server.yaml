name: Technitium DNS Server
repository: https://github.com/TechnitiumSoftware/DnsServer
category: dns-sinkhole
replaces:
  - tool: pi-hole
    fit: full
    note: A full authoritative and recursive DNS server that also blocks ads, with encrypted DNS built in.
