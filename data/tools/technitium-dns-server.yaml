name: Technitium DNS Server
repository: https://github.com/TechnitiumSoftware/DnsServer
category: dns-sinkhole
replaces:
  - tool: pi-hole
    fit: full
    note: A full authoritative and recursive DNS server that also blocks ads, with encrypted DNS built in.
  - tool: nextdns
    fit: full
    note: Encrypted DNS, block lists and per-client rules on your own server.
  - tool: amazon-route-53
    fit: partial
    note: Authoritative DNS server with zones, records and a web console; no domain registration or health-checked routing.
deploy: [container, compose]
