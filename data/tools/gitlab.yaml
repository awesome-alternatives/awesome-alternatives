name: GitLab
repository: https://github.com/gitlabhq/gitlabhq
category: git-forge
terms: open-core
replaces:
  - tool: github
    fit: full
    note: Repositories, merge requests, CI/CD and registries on your own server. Some features need a paid tier.
  - tool: jenkins
    fit: partial
    note: CI/CD built into the forge, configured in .gitlab-ci.yml.
  - tool: bitbucket
    fit: full
    note: Repositories, merge requests and CI/CD on your own server.
capabilities:
  ci:
    docs: https://docs.gitlab.com/ci/
  container-registry:
    docs: https://docs.gitlab.com/user/packages/container_registry/
  package-registry:
    docs: https://docs.gitlab.com/user/packages/package_registry/
  wiki:
    docs: https://docs.gitlab.com/user/project/wiki/
  pages:
    docs: https://docs.gitlab.com/user/project/pages/
deploy: [container, compose, helm, package]
