name: DuckDB
repository: https://github.com/duckdb/duckdb
category: analytical-database
replaces:
  - tool: snowflake
    fit: partial
    note: In-process analytical SQL over local files, Parquet and object storage, on one machine.
  - tool: bigquery
    fit: partial
    note: Analytical SQL on one machine.
  - tool: amazon-athena
    fit: partial
    note: Queries Parquet and CSV files in S3 with SQL from a local process; no serverless service to run it for you.
