name: SiYuan
repository: https://github.com/siyuan-note/siyuan
category: note-taking
replaces:
  - tool: obsidian
    fit: full
    note: Local-first notes with block references and bidirectional links.
  - tool: notion
    fit: partial
    note: Blocks and database views, local-first.
  - tool: typora
    fit: partial
    note: Block-based WYSIWYG markdown editor; a full note system rather than a single-file editor.
