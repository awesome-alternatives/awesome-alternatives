name: Bun
repository: https://github.com/oven-sh/bun
category: javascript-runtime
replaces:
  - tool: nodejs
    fit: full
    note: Aims at Node API compatibility, most packages run unchanged.
  - tool: npm
    fit: full
    note: bun install reads package.json and writes its own lockfile.
  - tool: ts-node
    fit: full
    note: Runs TypeScript files directly, with no separate compile step.
  - tool: jest
    fit: partial
    note: bun test runs Jest-style tests with most of its matchers.
terms: open
