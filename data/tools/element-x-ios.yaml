name: Element X iOS
repository: https://github.com/element-hq/element-x-ios
category: chat-client
replaces:
  - tool: whatsapp
    fit: partial
    note: End-to-end encrypted Matrix messenger for chats and groups; contacts must be on Matrix and there is no phone number sign-up.
  - tool: slack
    fit: partial
    note: Mobile client for Matrix rooms and threads; needs a Matrix homeserver.
