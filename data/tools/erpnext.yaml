name: ERPNext
repository: https://github.com/frappe/erpnext
category: erp
replaces:
  - tool: netsuite
    fit: full
    note: Accounting, inventory, manufacturing, HR and CRM, fully open source.
  - tool: odoo
    fit: full
    note: A comparable module set without a paid edition.
  - tool: sortly
    fit: partial
    note: Stock items, warehouses, batches and barcodes inside a full ERP; heavier to set up than a dedicated inventory app.
  - tool: square-pos
    fit: partial
    note: Point of sale module with offline mode and stock sync; payment terminals need extra setup.
