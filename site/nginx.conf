server {
    listen 8080;
    root /usr/share/nginx/html;
    absolute_redirect off;
    server_tokens off;
    charset utf-8;

    gzip_static on;
    gzip_vary on;

    include /etc/nginx/snippets/security-headers.conf;

    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    error_page 403 404 =404 /404.html;
}
