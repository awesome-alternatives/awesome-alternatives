server {
    listen 8080;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/index.html =404;
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    error_page 404 /404.html;
}
