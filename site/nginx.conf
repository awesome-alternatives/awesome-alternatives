map $uri $not_found_page {
    default 404.html;
    ~^/(?<not_found_locale>fr|es|de|pt|ja|id)/ $not_found_locale/404/;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    absolute_redirect off;
    server_tokens off;
    charset utf-8;

    rewrite ^(.*)roxycloud(.*)$ $1stashden$2 permanent;

    gzip_static on;
    gzip_vary on;

    include /etc/nginx/snippets/security-headers.conf;

    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ \.md$ {
        types { }
        default_type "text/markdown; charset=utf-8";
    }

    location ~ ^/(?<compare_locale>(?:fr|es|de|pt|ja|id)/)?compare/(?<compare_pair>[^/]+)/?$ {
        if ($compare_canonical) {
            return 301 /${compare_locale}compare/$compare_canonical/$is_args$args;
        }
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    error_page 403 404 =404 /$not_found_page;
}
