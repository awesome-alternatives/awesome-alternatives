name: Label pull request

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]

permissions: {}

jobs:
  label:
    name: Label from the validation verdict
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: verdict
        continue-on-error: true
        with:
          name: pr-labels
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pr-labels
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.verdict.outcome == 'success'
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.verdict.outcome == 'success'
        with:
          node-version: '24'
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        if: steps.verdict.outcome == 'success'
        with:
          client-id: ${{ vars.WRITE_APP_CLIENT_ID }}
          private-key: ${{ secrets.WRITE_APP_PRIVATE_KEY }}
          permission-pull-requests: write
      - if: steps.app.outcome == 'success'
        run: |
          if [ ! -f "$RUNNER_TEMP/pr-labels/labels.json" ]; then
            echo "validation stopped before a verdict, labels left as they are"
            exit 0
          fi
          node scripts/pr-labels.ts "$RUNNER_TEMP/pr-labels"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
