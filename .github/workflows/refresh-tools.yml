name: Refresh tools

on:
  push:
    branches: [main]
    paths: ['data/tools/**']
  workflow_dispatch:
    inputs:
      slugs:
        description: Tool slugs to refresh, separated by spaces
        required: true
        type: string

permissions:
  contents: read

run-name: Refresh ${{ inputs.slugs || 'the tools changed on main' }}

jobs:
  plan:
    name: Check the slugs
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.plan.outputs.slugs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: data/tools
      - id: plan
        shell: bash
        env:
          SLUGS: ${{ inputs.slugs }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ $EVENT == push ]]; then
            SLUGS=$(
              gh api "repos/$REPOSITORY/compare/$BEFORE...$AFTER" \
                --jq '.files[] | select(.status != "removed") | .filename' |
                sed -n 's#^data/tools/\([^/]*\)\.yaml$#\1#p'
            )
          fi
          slugs=$(
            for slug in $SLUGS; do
              if [[ ! $slug =~ ^[a-z0-9]+(-[a-z0-9]+)*$ || ! -f data/tools/$slug.yaml ]]; then
                echo "::error::$slug is not a tool in data/tools" >&2
                exit 1
              fi
              echo "$slug"
            done | sort -u | jq -Rnc '[inputs]'
          )
          count=$(jq length <<<"$slugs")
          if [[ $EVENT == push ]] && (( count == 0 || count > 20 )); then
            echo "::notice::$count tools changed, left to the nightly refresh"
            slugs='[]'
          elif (( count == 0 || count > 20 )); then
            echo "::error::expected between 1 and 20 slugs, got $count" >&2
            exit 1
          fi
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"

  refresh:
    name: Refresh ${{ matrix.slug }}
    needs: plan
    if: ${{ needs.plan.outputs.slugs != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.plan.outputs.slugs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - run: node scripts/refresh-tool.ts "$SLUG" entries
        env:
          SLUG: ${{ matrix.slug }}
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: entry-${{ matrix.slug }}
          path: entries/${{ matrix.slug }}.json
          retention-days: 1

  merge:
    name: Merge into the catalog
    needs: [plan, refresh]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.slugs != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: entry-*
          merge-multiple: true
          path: ${{ runner.temp }}/entries
      - name: Commit the refreshed entries
        env:
          GH_TOKEN: ${{ github.token }}
          SLUGS: ${{ join(fromJSON(needs.plan.outputs.slugs), ' ') }}
        run: |
          scripts/ci/push-catalog.sh "chore(catalog): refresh $SLUGS" node scripts/refresh-merge.ts "$RUNNER_TEMP/entries"
