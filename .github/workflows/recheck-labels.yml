name: Recheck young pull requests

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recheck-labels
  cancel-in-progress: false

jobs:
  recheck:
    name: Rerun Validate on pull requests labelled too-new
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: ${{ vars.WRITE_APP_CLIENT_ID }}
          private-key: ${{ secrets.WRITE_APP_PRIVATE_KEY }}
          permission-actions: write
          permission-pull-requests: read
      - run: node scripts/recheck-labels.ts
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
