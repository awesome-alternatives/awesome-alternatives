name: API

on:
  pull_request:
    paths: ['api/**', 'generated/catalog.json', '.github/workflows/api.yml']
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api.yml']

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: docker build -t api:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name api -p 3000:3000 api:ci
          for _ in $(seq 1 60); do curl -sf localhost:3000/healthz && break; sleep 1; done
          docker logs api 2>&1 | tee api.log
          grep -q "local embedding model loaded" api.log
          curl -sf -X POST localhost:3000/v1/search -H 'content-type: application/json' -d '{"q":"generate a changelog from git history"}' | tee search.json
          grep -q '"interpretedBy":"local"' search.json
