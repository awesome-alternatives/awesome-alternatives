name: Site

on:
  pull_request:
    paths: ['site/**', 'generated/**', 'data/categories.yaml', 'data/category-redirects.yaml', 'data/groups.yaml', 'data/migrations/**', 'data/benchmarks/**', 'CONTRIBUTING.md', 'scripts/lib/types.ts', 'scripts/lib/rules.ts', 'scripts/lib/trending.ts', 'scripts/lib/contributors.ts', 'scripts/lib/order.ts', '.github/workflows/site.yml']
  push:
    branches: [main]
    paths: ['site/**', 'generated/**', 'data/categories.yaml', 'data/category-redirects.yaml', 'data/groups.yaml', 'data/migrations/**', 'data/benchmarks/**', 'CONTRIBUTING.md', 'scripts/lib/types.ts', 'scripts/lib/rules.ts', 'scripts/lib/trending.ts', 'scripts/lib/contributors.ts', 'scripts/lib/order.ts', '.github/workflows/site.yml']

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: docker build -f Dockerfile -t site:ci ..
