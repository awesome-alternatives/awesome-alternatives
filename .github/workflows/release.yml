name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: FerrLabs/FerrFlow@208e4d994bcac5938e398a134feb5631be812824 # v7.33.0
        with:
          version: '7.22.0'
          bot: true
      - name: List the tags this release created
        id: tags
        run: |
          git fetch -q --tags origin main
          tags=$(git tag --points-at FETCH_HEAD | grep -E '^(api|site|refresh)-v' | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Released: $tags"

  image:
    name: Image ${{ matrix.tag }}
    needs: release
    if: ${{ needs.release.outputs.tags != '' && needs.release.outputs.tags != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        tag: ${{ fromJSON(needs.release.outputs.tags) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.tag }}
          persist-credentials: false
      - name: Build and push
        env:
          TAG: ${{ matrix.tag }}
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          name="${TAG%%-v*}"
          version="${TAG#*-v}"
          image="ghcr.io/${OWNER}/${name}"
          case "$name" in
            api) context=api; file=api/Dockerfile ;;
            site) context=.; file=site/Dockerfile ;;
            refresh) context=.; file=scripts/runner/Dockerfile ;;
          esac
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker build -f "$file" \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.version=$version" \
            -t "$image:$version" -t "$image:latest" "$context"
          docker push "$image:$version"
          docker push "$image:latest"
