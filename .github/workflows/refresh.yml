name: Refresh

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/**

permissions:
  contents: read

concurrency:
  group: refresh
  # Five catalog merges in a row are one refresh, not five: each run reads the
  # whole catalog anyway, and the budget is per hour.
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh catalog from GitHub
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The etags turn an unchanged repository into a 304, which GitHub does not
      # count against the hourly budget. Restoring yesterday's cache is what
      # keeps a refresh of 240 tools inside the 1,000 requests github.token gets.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/github-etags.json
          key: github-etags-${{ github.run_id }}
          restore-keys: github-etags-
      - run: pnpm refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit the refreshed catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/catalog.json README.md
          if git diff --cached --quiet; then
            echo "catalog unchanged"
          else
            git commit -m "chore(catalog): refresh from GitHub"
            git pull --rebase origin main
            git push
            gh workflow run release.yml --ref main
          fi
