name: Refresh

on:
  workflow_dispatch:
    inputs:
      force:
        description: Read every repository in full, ignoring the facts the catalog already published
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - data/**

permissions:
  contents: read

concurrency:
  group: refresh
  # Five catalog merges in a row are one refresh, not five: each run reads the
  # whole catalog anyway, and the budget is per hour.
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh catalog from GitHub
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - run: pnpm refresh
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          REFRESH_FORCE: ${{ inputs.force }}
          REFRESH_COMMIT_MESSAGE: ${{ runner.temp }}/drafted-message
          REFRESH_PROPOSALS: ${{ runner.temp }}/proposals.json
      - name: Keep the refreshed catalog aside
        run: |
          mkdir -p "$RUNNER_TEMP/refreshed/generated"
          cp generated/catalog.json generated/events.json "$RUNNER_TEMP/refreshed/generated/"
          cp README.md "$RUNNER_TEMP/refreshed/"
          git diff --binary -- data/tools > "$RUNNER_TEMP/maintainer-values.patch"
      - name: Commit the refreshed catalog
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE_FILE: ${{ runner.temp }}/commit-message
        run: |
          scripts/ci/push-catalog.sh "chore(catalog): refresh from GitHub" \
            bash scripts/ci/restore-refreshed.sh "$RUNNER_TEMP/refreshed" "$RUNNER_TEMP/maintainer-values.patch" "$RUNNER_TEMP/drafted-message"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: maintainer-proposals
          path: ${{ runner.temp }}/proposals.json
          retention-days: 1

  propose:
    name: Propose maintainers' editorial changes
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maintainer-proposals
          path: ${{ runner.temp }}/proposals
      - run: node scripts/propose.ts "$RUNNER_TEMP/proposals/proposals.json"
        env:
          GH_TOKEN: ${{ github.token }}
