name: Refresh

on:
  workflow_dispatch:
    inputs:
      force:
        description: Read every repository in full, ignoring the facts the catalog already published
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - data/**

permissions:
  contents: read

concurrency:
  group: refresh
  # Five catalog merges in a row are one refresh, not five: each run reads the
  # whole catalog anyway, and the budget is per hour.
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh catalog from GitHub
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - run: pnpm refresh
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          REFRESH_FORCE: ${{ inputs.force }}
          REFRESH_COMMIT_MESSAGE: ${{ runner.temp }}/drafted-message
          REFRESH_PROPOSALS: ${{ runner.temp }}/proposals.json
      - name: Keep the refreshed catalog aside
        run: |
          mkdir -p "$RUNNER_TEMP/refreshed/generated"
          cp generated/catalog.json generated/events.json "$RUNNER_TEMP/refreshed/generated/"
          cp README.md "$RUNNER_TEMP/refreshed/"
          cp -r catalog "$RUNNER_TEMP/refreshed/"
          git diff --binary -- data/tools > "$RUNNER_TEMP/maintainer-values.patch"
      - name: Commit the refreshed catalog
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE_FILE: ${{ runner.temp }}/commit-message
        run: |
          scripts/ci/push-catalog.sh "chore(catalog): refresh from GitHub" \
            bash scripts/ci/restore-refreshed.sh "$RUNNER_TEMP/refreshed" "$RUNNER_TEMP/maintainer-values.patch" "$RUNNER_TEMP/drafted-message"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: maintainer-proposals
          path: ${{ runner.temp }}/proposals.json
          retention-days: 1

  propose:
    name: Propose maintainers' editorial changes
    needs: refresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maintainer-proposals
          path: ${{ runner.temp }}/proposals
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.WRITE_APP_CLIENT_ID }}
          private-key: ${{ secrets.WRITE_APP_PRIVATE_KEY }}
      - run: node scripts/propose.ts "$RUNNER_TEMP/proposals/proposals.json"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
